name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        mode: [local-files, postgres-queue]
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: junction, POSTGRES_PASSWORD: junction, POSTGRES_DB: junction_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U junction" --health-interval 2s --health-timeout 5s --health-retries 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: System libraries for SUMO
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libx11-6 libxext6 libxrender1 libgl1 libexpat1 libatomic1
      - run: pip install -r requirements.txt
      - name: Ingolstadt networks (RESCO)
        run: |
          git init -q data/resco && cd data/resco
          git remote add origin https://github.com/UnivOfAlabama-BittleResearchGroup/RESCO
          git fetch -q --depth 1 origin 101b0b725c21809097b2b1414da6fbec3c0b9e0a && git checkout -q FETCH_HEAD
      - name: Tests
        env:
          DATABASE_URL: ${{ matrix.mode == 'postgres-queue' && 'postgresql://junction:junction@localhost:5432/junction_test' || '' }}
          JUNCTION_EXECUTION: ${{ matrix.mode == 'postgres-queue' && 'queue' || 'local' }}
          JUNCTION_TEST_RESET_DB: "1"
        run: python -m pytest -q
      - name: Worker log
        if: failure() && matrix.mode == 'postgres-queue'
        run: cat /tmp/tsapi_*/worker.log || true

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  image:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t junction:ci backend
      - name: The image starts and answers
        run: |
          docker run -d --name api -p 8080:80 junction:ci
          for i in $(seq 1 30); do curl -sf localhost:8080/api/health && break; sleep 2; done
          curl -sf localhost:8080/api/networks | grep -q ingolstadt21
          docker run --rm --entrypoint /app/docker-entrypoint.sh junction:ci \
            python -c "import libsumo, trafficsim.worker; print('worker imports ok')"
